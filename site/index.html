<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Generator — Markdown to PDF</title>
<style>
  :root {
    --ink: #17201f;
    --ink-soft: #5b6a68;
    --paper: #ffffff;
    --bg: #e4e8e6;
    --line: #c8d0cd;
    --accent: #0f5d5d;
    --accent-soft: #d9e6e4;
    --warn: #8a3324;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }

  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
  }

  header .spacer { flex: 1; }

  button {
    font: inherit;
    font-size: 13px;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }

  button:hover { border-color: var(--accent); color: var(--accent); }

  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  button.primary:hover { background: #0b4a4a; color: #fff; }

  button[disabled] { opacity: 0.5; cursor: not-allowed; }

  select {
    font: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }

  select:hover { border-color: var(--accent); color: var(--accent); }

  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn-col {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .btn-col small {
    font-size: 10px;
    line-height: 1;
    min-height: 10px;
    color: var(--ink-soft);
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(340px, 42%) 1fr;
    min-height: 0;
  }

  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

  .pane + .pane { border-left: 1px solid var(--line); }

  .pane-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }

  .pane-head .spacer { flex: 1; }

  #editor {
    flex: 1;
    width: 100%;
    border: 0;
    resize: none;
    padding: 16px 18px;
    background: var(--paper);
    color: var(--ink);
    font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    tab-size: 2;
  }

  #editor:focus { outline: none; }

  #preview {
    flex: 1;
    border: 0;
    width: 100%;
    background: #9aa5a2;
  }

  .status {
    padding: 7px 14px;
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--paper);
    border-top: 1px solid var(--line);
    min-height: 30px;
  }

  .status.error { color: var(--warn); }

  #drop {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(228, 232, 230, 0.92);
    z-index: 10;
  }

  #drop.visible { display: flex; }

  #drop div {
    border: 2px dashed var(--accent);
    border-radius: var(--radius);
    padding: 48px 64px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 17px;
    letter-spacing: 0.02em;
  }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<header>
  <h1 id="heading">CV Generator</h1>
  <p id="tagline">Markdown on the left, finished PDF on the right. Drop an .md file anywhere in the window.</p>
  <span class="spacer"></span>
  <button id="btn-open">Open .md</button>
  <button id="btn-sample">Load sample</button>
  <span class="btn-col">
    <button id="btn-save-md">Save .md</button>
    <small id="name-md"></small>
  </span>
  <span class="btn-col">
    <button id="btn-pdf" class="primary">Download PDF</button>
    <small id="name-pdf"></small>
  </span>
  <select id="lang" aria-label="Language">
    <option value="en">EN</option>
    <option value="cs">CZ</option>
  </select>
  <input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
</header>

<main>
  <section class="pane">
    <div class="pane-head"><span id="filename">resume.md</span><span class="spacer"></span><span id="counter"></span></div>
    <textarea id="editor" spellcheck="false" aria-label="Markdown source"></textarea>
  </section>
  <section class="pane">
    <div class="pane-head" id="preview-head">PDF preview</div>
    <iframe id="preview" title="PDF preview"></iframe>
  </section>
</main>

<div class="status" id="status">Loading fonts…</div>

<div id="drop"><div id="drop-text">Drop your .md file here</div></div>

<script src="vendor/pdfmake.min.js"></script>
<script src="cv-format.js"></script>
<script src="app.js"></script>
</body>
</html>
